<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Masuk ke akun GaFont.">
    <title>Masuk — GaFont</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="flex min-h-screen min-w-[320px] flex-col bg-canvas font-sans text-white antialiased">
    <header class="mx-auto flex h-19 w-[calc(100%-3rem)] max-w-280 items-center justify-between border-b border-line max-[480px]:h-16 max-[480px]:w-[calc(100%-1.75rem)]">
        <a class="inline-flex items-center gap-2.5 text-base font-bold tracking-[-0.04em] text-inherit no-underline" href="./index.html" aria-label="GaFont beranda">
            <img class="h-6 w-6" src="../assets/img/pink.jpg" alt="" aria-hidden="true" width="24" height="24">
            <span>GaFont</span>
        </a>
     
    </header>

    <main class="flex flex-1 items-center justify-center px-6 py-12">
        <section class="w-full max-w-[420px]">
            <p class="mb-2.5 text-[10px] font-bold uppercase tracking-[0.13em] text-dodger">Selamat datang kembali</p>
            <h1 class="m-0 text-3xl font-semibold tracking-[-0.05em]">Masuk ke GaFont</h1>
            <p class="mt-2 text-sm text-muted">Masuk untuk melanjutkan eksplorasi tipografimu.</p>

            <form id="auth-form" class="mt-8 grid gap-5" data-endpoint="/api/login">
                <div>
                    <label class="mb-2 block text-xs font-semibold text-soft" for="email">Email</label>
                    <input class="w-full rounded-lg border border-line bg-panel px-3.5 py-3 text-sm text-white outline-none transition-colors placeholder:text-[#737373] focus:border-dodger focus:ring-2 focus:ring-dodger/20" id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="nama@email.com" required>
                </div>
                <div>
                    <div class="mb-2 flex items-center justify-between gap-3">
                        <label class="text-xs font-semibold text-soft" for="password">Password</label>
                    </div>
                    <input class="w-full rounded-lg border border-line bg-panel px-3.5 py-3 text-sm text-white outline-none transition-colors placeholder:text-[#737373] focus:border-dodger focus:ring-2 focus:ring-dodger/20" id="password" name="password" type="password" autocomplete="current-password" maxlength="72" placeholder="Masukkan password" required>
                </div>
                <p id="auth-message" class="hidden rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2.5 text-xs text-red-300" role="status" aria-live="polite"></p>
                <button class="mt-1 min-h-11 rounded-lg bg-dodger px-4 text-sm font-bold text-black transition-colors hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-dodger disabled:cursor-wait disabled:opacity-60" type="submit">Masuk</button>
            </form>

            <p class="mt-6 text-center text-xs text-muted">Belum punya akun? <a class="font-semibold text-dodger hover:text-white" href="./register.html">Buat akun</a></p>
        </section>
    </main>

    <footer class="py-6 text-center text-[10px] text-muted">GaFont · Dibuat untuk eksplorasi tipografi.</footer>
    <script src="./script/auth.js"></script>
</body>

</html>
